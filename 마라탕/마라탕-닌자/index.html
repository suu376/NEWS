<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0c06">
<title>마라탕 닌자 · MALATANG NINJA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#120804;color:#fff;
  font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic','Noto Sans CJK KR',sans-serif;
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
#app{position:fixed;inset:0;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:crosshair;touch-action:none}
.hidden{display:none!important}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
button{font-family:inherit}

/* ---------- buttons ---------- */
.btn{pointer-events:auto;cursor:pointer;border:3px solid #ffd76a;border-radius:14px;
  background:linear-gradient(#ef4a2f,#b0170f 70%,#8c0f08);color:#fff3d0;font-weight:900;
  font-size:clamp(17px,3.2vmin,24px);padding:.5em 1.3em;letter-spacing:.02em;
  box-shadow:0 5px 0 #4f0904,0 9px 18px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.35);
  text-shadow:0 2px 0 #4f0904;transition:transform .08s,filter .15s;white-space:nowrap}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #4f0904,0 4px 10px rgba(0,0,0,.5),inset 0 2px 0 rgba(255,255,255,.3)}
.btn.gold{background:linear-gradient(#fff0a0,#ffc928 45%,#e99400);color:#4a1600;text-shadow:0 1px 0 #fff6c4;border-color:#fff4c8;
  box-shadow:0 5px 0 #7a3a00,0 9px 20px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.6)}
.btn.big{font-size:clamp(22px,4.4vmin,34px);padding:.5em 1.5em;border-radius:18px}
.btn.small{font-size:clamp(14px,2.6vmin,18px);padding:.4em .9em}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.iconbtn{pointer-events:auto;cursor:pointer;width:clamp(40px,7vmin,52px);height:clamp(40px,7vmin,52px);border-radius:50%;
  border:3px solid #ffd76a;background:radial-gradient(circle at 35% 30%,#e84a30,#8c0f08);color:#fff3d0;
  font-size:clamp(15px,2.8vmin,20px);font-weight:900;box-shadow:0 4px 0 #4f0904,0 6px 12px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center}
.iconbtn:active{transform:translateY(2px)}
.linkbtn{pointer-events:auto;cursor:pointer;background:none;border:none;color:#f8d9a0;font-size:clamp(13px,2.4vmin,16px);
  text-decoration:underline;text-underline-offset:3px;opacity:.85;padding:6px}

/* ---------- loading ---------- */
#loading{background:#120804;z-index:50;font-weight:900;color:#ffd23f;font-size:20px;letter-spacing:.1em}

/* ---------- title ---------- */
#title{pointer-events:none;gap:clamp(8px,1.6vh,16px);padding:20px}
.logo{text-align:center;transform:rotate(-3deg);animation:logoIn .9s cubic-bezier(.2,1.6,.4,1) both}
@keyframes logoIn{from{transform:scale(.2) rotate(-20deg);opacity:0}to{transform:scale(1) rotate(-3deg);opacity:1}}
.logo-cn{display:inline-block;background:#c8170f;color:#ffe08a;border:3px solid #ffd76a;border-radius:8px;
  font-family:'Noto Serif CJK KR','Noto Serif CJK SC','STKaiti','KaiTi',serif;font-weight:900;
  font-size:clamp(16px,3.4vmin,26px);padding:2px 14px;letter-spacing:.25em;box-shadow:0 4px 0 #4f0904;transform:rotate(2deg)}
.logo-ko{font-weight:900;font-size:clamp(54px,13vmin,120px);line-height:1.05;letter-spacing:-.02em;
  background:linear-gradient(#fff7c0 5%,#ffd23f 35%,#ff8a1e 60%,#e5261b 85%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(3px 0 0 #3a0a00) drop-shadow(-3px 0 0 #3a0a00) drop-shadow(0 3px 0 #3a0a00) drop-shadow(0 -3px 0 #3a0a00) drop-shadow(0 7px 0 #1a0400) drop-shadow(0 0 22px rgba(255,90,20,.55))}
.logo-en{font-family:'Arial Black','Impact',sans-serif;font-weight:900;font-size:clamp(18px,4.2vmin,36px);letter-spacing:.18em;color:#fff1c8;
  text-shadow:0 3px 0 #a3140c,0 5px 0 #3a0a00,0 0 18px rgba(255,120,40,.6)}
.tagline{background:rgba(20,6,2,.55);border-radius:20px;padding:4px 14px;font-weight:800;color:#ffe7b8;font-size:clamp(14px,2.8vmin,20px);text-shadow:0 2px 4px #000;text-align:center}
#title .btn,#title .linkbtn{pointer-events:auto}
.howto{background:rgba(20,6,2,.6);border-radius:14px;padding:5px 12px;color:#f1c98f;font-size:clamp(12px,2.2vmin,15px);text-shadow:0 1px 3px #000;opacity:.9;text-align:center}
#soundBtn{position:absolute;top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));z-index:20}

/* ---------- intro dialog ---------- */
#dialog{position:absolute;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom));
  width:min(94vw,780px);min-height:clamp(128px,21vh,180px);z-index:10;
  background:linear-gradient(rgba(52,14,6,.95),rgba(24,8,3,.97));border:3px solid #d9a441;border-radius:18px;
  box-shadow:0 0 0 3px #5a1206,0 12px 30px rgba(0,0,0,.6),inset 0 0 30px rgba(255,120,40,.12);
  padding:clamp(22px,3.6vh,30px) clamp(16px,3vw,26px) 54px;animation:dlgIn .35s ease-out both}
@keyframes dlgIn{from{transform:translate(-50%,40px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
#dialog .name{position:absolute;top:-19px;left:18px;background:linear-gradient(#ef4a2f,#a81610);border:2px solid #ffd76a;border-radius:10px;
  padding:3px 16px;font-weight:900;font-size:clamp(14px,2.6vmin,18px);color:#ffeeb8;box-shadow:0 3px 0 #4f0904}
#dialog .stage{color:#f5c26b;font-style:italic;font-size:clamp(12px,2.3vmin,16px);min-height:1.3em;opacity:.9}
#dialog .line{font-size:clamp(18px,3.5vmin,27px);font-weight:900;line-height:1.45;color:#fff8e6;text-shadow:0 2px 0 #3a0a00;min-height:1.5em;word-break:keep-all}
#nextBtn{position:absolute;right:12px;bottom:10px}
#nextBtn .arrow{display:inline-block;animation:nudge .7s ease-in-out infinite}
@keyframes nudge{50%{transform:translateX(4px)}}
#skipBtn{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));z-index:20;
  pointer-events:auto;cursor:pointer;background:rgba(0,0,0,.45);border:2px solid rgba(255,215,106,.7);color:#ffe7a8;border-radius:20px;
  padding:6px 14px;font-weight:900;font-size:clamp(12px,2.2vmin,15px)}
#goBtn{position:absolute;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(max(14px,env(safe-area-inset-bottom)) + clamp(150px,25vh,210px));z-index:12}
#goBtn.show{animation:goIn .5s cubic-bezier(.2,1.8,.4,1) both, pulse 1s ease-in-out .5s infinite}
@keyframes goIn{from{transform:scale(.2)}to{transform:scale(1)}}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.scorebox{position:absolute;left:max(14px,env(safe-area-inset-left));top:max(8px,env(safe-area-inset-top))}
.score{font-family:'Arial Black','Impact','Noto Sans KR',sans-serif;font-weight:900;font-size:clamp(36px,7.4vmin,62px);line-height:1;
  background:linear-gradient(#fffbd0,#ffd23f 45%,#ff9a12 75%,#e0600a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 0 0 #3a0e00) drop-shadow(-2px 0 0 #3a0e00) drop-shadow(0 2px 0 #3a0e00) drop-shadow(0 -2px 0 #3a0e00) drop-shadow(0 4px 0 #1a0500);
  display:inline-block;transform-origin:left center}
.score.bump{animation:bump .18s ease-out}
@keyframes bump{50%{transform:scale(1.16)}}
.best{margin-top:2px;font-family:'Arial Black','Impact',sans-serif;font-weight:900;font-size:clamp(13px,2.5vmin,19px);color:#ffe9a8;
  text-shadow:0 2px 0 #3a0e00,1px 0 0 #3a0e00,-1px 0 0 #3a0e00;letter-spacing:.06em}
.best b{color:#ffd23f}
.hud-right{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(8px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.timer{position:relative;width:clamp(58px,11vmin,84px);height:clamp(58px,11vmin,84px);border-radius:50%;
  background:radial-gradient(circle at 40% 35%,#3a1a0c,#160803);border:4px solid #d9a441;box-shadow:0 0 0 3px #5a1206,0 6px 14px rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center}
.timer svg{position:absolute;inset:-4px;width:calc(100% + 8px);height:calc(100% + 8px);transform:rotate(-90deg)}
.timer span{font-family:'Arial Black','Impact',sans-serif;font-weight:900;font-size:clamp(24px,4.6vmin,36px);color:#ffd23f;text-shadow:0 2px 0 #3a0e00}
.timer.hurry span{color:#ff4a2a;animation:pulse .5s ease-in-out infinite}
.timer .lbl{position:absolute;bottom:-18px;font-size:11px;font-weight:900;color:#f5c26b;text-shadow:0 1px 2px #000;letter-spacing:.1em}

/* ---------- panels ---------- */
.panel{pointer-events:auto;background:linear-gradient(#3a1208,#1d0904);border:3px solid #d9a441;border-radius:20px;
  box-shadow:0 0 0 4px #5a1206,0 20px 50px rgba(0,0,0,.7),inset 0 0 40px rgba(255,120,40,.1);padding:22px 24px;
  display:flex;flex-direction:column;align-items:stretch;gap:12px;width:min(92vw,380px)}
.panel h2{text-align:center;font-weight:900;color:#ffd23f;font-size:clamp(22px,4vmin,30px);text-shadow:0 3px 0 #4f0904}
.panel label{display:flex;align-items:center;gap:10px;font-weight:800;color:#ffe7b8;font-size:15px}
.panel label span{width:64px}
.panel input[type=range]{flex:1;accent-color:#ffc928;height:28px}
#pauseMenu,#settings{background:rgba(10,4,2,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:30}

/* ---------- result ---------- */
#result{background:radial-gradient(ellipse at center,rgba(40,10,4,.55),rgba(8,3,1,.88));z-index:25;overflow-y:auto;justify-content:flex-start;padding:14px 10px 24px;touch-action:pan-y}
.res-card{pointer-events:auto;margin:auto;width:min(96vw,880px);background:linear-gradient(#3d1409,#1b0803);border:3px solid #d9a441;border-radius:22px;
  box-shadow:0 0 0 4px #5a1206,0 20px 60px rgba(0,0,0,.8);padding:clamp(14px,2.4vh,22px) clamp(12px,2.4vw,24px);animation:cardIn .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes cardIn{from{transform:translateY(60px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.res-title{text-align:center;font-weight:900;font-size:clamp(24px,4.6vmin,38px);color:#ffd23f;text-shadow:0 3px 0 #4f0904,0 0 16px rgba(255,120,40,.5);margin-bottom:8px}
.res-title small{display:block;font-size:.45em;color:#f5c26b;letter-spacing:.2em;text-shadow:none}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:stretch}
@media (max-width:640px){.res-grid{grid-template-columns:1fr}}
.boss-box{position:relative;display:flex;align-items:flex-end;gap:6px;background:rgba(0,0,0,.25);border-radius:14px;padding:8px;min-height:170px}
#resBoss{width:clamp(150px,36vw,220px);height:clamp(150px,36vw,210px);flex:none}
.bubble{position:relative;flex:1;align-self:center;background:#fff8e6;color:#3a1206;border-radius:16px;padding:12px 14px;font-weight:900;
  font-size:clamp(15px,2.8vmin,20px);line-height:1.4;box-shadow:0 4px 0 #b88a3a;min-height:3.2em;word-break:keep-all}
.bubble:before{content:'';position:absolute;left:-12px;bottom:22px;border:8px solid transparent;border-right:14px solid #fff8e6}
.pot-box{background:rgba(0,0,0,.25);border-radius:14px;padding:8px;display:flex;flex-direction:column;align-items:center}
#resPot{width:100%;max-width:400px;aspect-ratio:16/10}
.pot-box .cap{font-weight:900;color:#f5c26b;font-size:13px;letter-spacing:.1em}
.score-row{display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 6px;flex-wrap:wrap}
.score-row .lbl{font-weight:900;color:#ffe7b8;font-size:clamp(14px,2.6vmin,18px)}
.score-row .big{font-family:'Arial Black','Impact',sans-serif;font-weight:900;font-size:clamp(44px,9vmin,72px);line-height:1;
  background:linear-gradient(#fffbd0,#ffd23f 45%,#ff9a12 75%,#e0600a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(2px 0 0 #3a0e00) drop-shadow(-2px 0 0 #3a0e00) drop-shadow(0 3px 0 #3a0e00) drop-shadow(0 -2px 0 #3a0e00)}
.newbest{background:#e5261b;color:#fff3c0;border:2px solid #ffd76a;border-radius:8px;padding:2px 10px;font-weight:900;font-size:15px;transform:rotate(-6deg);animation:pulse .8s infinite}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}
@media (max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:rgba(255,200,120,.08);border:2px solid rgba(217,164,65,.5);border-radius:12px;padding:8px 6px;text-align:center}
.stat .k{font-size:12px;font-weight:800;color:#f5c26b}
.stat .v{font-family:'Arial Black','Impact','Noto Sans KR',sans-serif;font-weight:900;font-size:clamp(20px,3.6vmin,28px);color:#fff1c8;text-shadow:0 2px 0 #4f0904;display:flex;align-items:center;justify-content:center;gap:4px;min-height:36px}
.stat .v img{width:34px;height:34px;object-fit:contain}
.stat .v .nm{font-family:'Noto Sans KR',sans-serif;font-size:clamp(13px,2.4vmin,16px)}
.ing-stats{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0 12px}
@media (max-width:640px){.ing-stats{grid-template-columns:repeat(4,1fr)}}
.ing{background:rgba(0,0,0,.25);border-radius:10px;padding:6px 2px;text-align:center}
.ing img{width:clamp(36px,7vmin,52px);height:clamp(36px,7vmin,52px);object-fit:contain;display:block;margin:0 auto}
.ing .n{font-size:11px;font-weight:800;color:#f5c26b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ing .c{font-family:'Arial Black',sans-serif;font-weight:900;color:#fff1c8;font-size:17px}
.ing.top{outline:2px solid #ffd23f;background:rgba(255,200,60,.15)}
.res-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="loading" class="screen">재료 손질 중…</div>

  <button id="soundBtn" class="iconbtn hidden" title="소리 설정">🔊</button>

  <div id="title" class="screen hidden">
    <div class="logo">
      <div class="logo-cn">麻辣烫忍者</div>
      <div class="logo-ko">마라탕 닌자</div>
      <div class="logo-en">MALATANG NINJA</div>
    </div>
    <p class="tagline">신입 막내의 60초 칼질 대작전!</p>
    <button id="startBtn" class="btn gold big pulse">▶ 가게 문 열기</button>
    <button id="quickBtn" class="linkbtn">오프닝 건너뛰고 바로 시작</button>
    <div class="howto">마우스·손가락으로 드래그해서 재료를 썰어라! &nbsp;연속으로 썰면 콤보!</div>
  </div>

  <button id="skipBtn" class="hidden">SKIP ▸▸</button>
  <div id="dialog" class="hidden">
    <div class="name">사장님</div>
    <div class="stage" id="dlgStage"></div>
    <div class="line" id="dlgLine"></div>
    <button id="nextBtn" class="btn small">다음 <span class="arrow">▶</span></button>
  </div>
  <button id="goBtn" class="btn gold big hidden">🔪 게임 시작!</button>

  <div id="hud" class="hidden">
    <div class="scorebox">
      <div class="score" id="score">0</div>
      <div class="best">BEST <b id="best">0</b></div>
    </div>
    <div class="hud-right">
      <div class="timer" id="timerBox">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="rgba(0,0,0,.4)" stroke-width="7"/>
          <circle id="timerArc" cx="50" cy="50" r="46" fill="none" stroke="#ffd23f" stroke-width="7" stroke-linecap="round" stroke-dasharray="289" stroke-dashoffset="0"/></svg>
        <span id="time">60</span><div class="lbl">TIME</div>
      </div>
      <button id="pauseBtn" class="iconbtn" title="일시정지">❚❚</button>
    </div>
  </div>

  <div id="pauseMenu" class="screen hidden">
    <div class="panel">
      <h2>잠깐! 숨 돌리기</h2>
      <label><span>배경음악</span><input type="range" class="volM" min="0" max="1" step="0.05"></label>
      <label><span>효과음</span><input type="range" class="volS" min="0" max="1" step="0.05"></label>
      <button class="btn small muteBtn">🔇 음소거</button>
      <button id="resumeBtn" class="btn gold">계속하기</button>
      <button id="restartBtn" class="btn">처음부터 다시</button>
      <button id="quitBtn" class="btn">그만하고 결과 보기</button>
      <button id="homeBtn2" class="btn">타이틀로</button>
    </div>
  </div>

  <div id="settings" class="screen hidden">
    <div class="panel">
      <h2>소리 설정</h2>
      <label><span>배경음악</span><input type="range" class="volM" min="0" max="1" step="0.05"></label>
      <label><span>효과음</span><input type="range" class="volS" min="0" max="1" step="0.05"></label>
      <button class="btn small muteBtn">🔇 음소거</button>
      <button id="closeSettings" class="btn gold">닫기</button>
    </div>
  </div>

  <div id="result" class="screen hidden">
    <div class="res-card">
      <div class="res-title">오늘의 영업 결과<small>MALATANG NINJA REPORT</small></div>
      <div class="res-grid">
        <div class="boss-box"><canvas id="resBoss"></canvas><div class="bubble" id="resLine"></div></div>
        <div class="pot-box"><canvas id="resPot"></canvas><div class="cap" id="potCap">완성된 마라탕</div></div>
      </div>
      <div class="score-row"><span class="lbl">최종 점수</span><span class="big" id="resScore">0</span><span class="newbest hidden" id="newBest">NEW BEST!</span></div>
      <div class="stats">
        <div class="stat"><div class="k">최고 콤보</div><div class="v" id="stCombo">0</div></div>
        <div class="stat"><div class="k">총 절단 개수</div><div class="v" id="stTotal">0</div></div>
        <div class="stat"><div class="k">가장 많이 자른 재료</div><div class="v" id="stMost">-</div></div>
        <div class="stat"><div class="k">완성한 마라탕</div><div class="v" id="stBowls">0</div></div>
      </div>
      <div class="ing-stats" id="ingStats"></div>
      <div class="res-btns">
        <button id="retryBtn" class="btn gold big">🔪 다시 도전하기</button>
        <button id="homeBtn" class="btn">오프닝 다시 보기</button>
      </div>
    </div>
  </div>

<script>

const $ = id => document.getElementById(id);

/* =========================================================

const Snd = (() => {

    mG.gain.setTargetAtTime(S.vm * m * 0.8, t, 0.03); sG.gain.setTargetAtTime(S.vs * m, t, 0.03);
  }
  const ok = () => ac && ac.state === 'running';
  function env(dest, t, a, peak, dec, hold = 0) {

  function filt(type, f, q, dest) { const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 1; b.connect(dest); return b; }

    addPart({ kind: 'bdrop', x: x + rand(-6, 6), y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1.4, size: rand(2.2, 5.5) * L.base / 100, color: choice(colors), g: 1.1, oy: y }); }

/* =========================================================
   UPDATE
   ========================================================= */
function updateBrothFx(dt) {
  BROTH.swirl += dt * 0.07;
  const P = L.pot;
  // bubbles
  if (Math.random() < dt * 14) { const a = rand(0, TAU), r = Math.sqrt(Math.random()) * 0.85; G.bubbles.push({ x: P.cx + Math.cos(a) * r * P.brx, y: P.bcy + Math.sin(a) * r * P.bry, max: rand(3, 10) * L.base / 100, t: 0, life: rand(0.5, 1.3) }); }
  for (const b of G.bubbles) b.t += dt;
  G.bubbles = G.bubbles.filter(b => { if (b.t >= b.life) { ripple(b.x, b.y, b.max * 2.2, 0.35, { thin: true }); return false; } return true; });
  if ((state === 'play' || state === 'title' || state === 'countdown') && Math.random() < dt * 5) Snd.bubble();
  // steam
  if (Math.random() < dt * 7 && G.steam.length < 26) { const a = rand(PI, TAU), r = rand(0.2, 0.9); G.steam.push({ x: P.cx + Math.cos(a) * r * P.brx, y: P.bcy + Math.sin(a) * r * P.bry * 0.6, vx: rand(-10, 10), vy: -rand(18, 40) * L.H / 800, s: rand(40, 90) * L.base / 110, t: 0, life: rand(2.2, 3.6), ph: rand(0, TAU) }); }
  for (const s of G.steam) { s.t += dt; s.x += (s.vx + Math.sin(s.t * 1.5 + s.ph) * 12) * dt; s.y += s.vy * dt; }
  G.steam = G.steam.filter(s => s.t < s.life);
  for (const r of G.ripples) { r.t += dt; r.r = lerp(2, r.max, easeOut(r.t / r.life)); }
  G.ripples = G.ripples.filter(r => r.t < r.life);
  G.potGlow = Math.max(0, G.potGlow - dt * 0.8); G.potShake = Math.max(0, G.potShake - dt * 20);
}
function updatePlay(dt) {
  if (G.hitstop > 0) { G.hitstop -= dt; dt *= 0.08; }
  if (state === 'play') {
    G.elapsed += dt; G.time = Math.max(0, GAME_TIME - G.elapsed);
    const sec = Math.ceil(G.time);
    if (sec !== G.lastTick) { G.lastTick = sec; if (sec <= 5 && sec > 0) Snd.tick(true); updateHUD(); }
    if (!G.fever && G.time <= 10) { G.fever = true; G.banner = { text: 'FEVER TIME!', sub: '마지막 10초! 마구 썰어라!', t: 0, life: 1.8, fever: true }; Snd.fanfare(2); Snd.setRate(1.12); }
    G.spawnT -= dt; if (G.spawnT <= 0 && G.time > 0.8) spawnWave();
    for (const q of G.queue) { q.t -= dt; if (q.t <= 0 && !q.done) { q.done = true; spawnItem(q.key, q.x, q.vx); } }
    G.queue = G.queue.filter(q => !q.done);
    if (G.comboT > 0) { G.comboT -= dt; if (G.comboT <= 0) G.combo = 0; }
    if (G.time <= 0) timeUp();
  }
  const g = L.g, H = L.H, P = L.pot;
  for (const it of G.items) { it.vy += g * dt; it.x += it.vx * dt; it.y += it.vy * dt; it.rot += it.vr * dt; }
  G.items = G.items.filter(it => !(it.vy > 0 && it.y - it.size > H));
  for (const h of G.halves) {
    h.t += dt; h.vy += g * dt;
    if (h.vy > 0 && h.y > H * 0.25) { h.vx += (P.cx - h.x) * 1.8 * dt; h.vx *= 1 - 0.8 * dt; }
    h.x += h.vx * dt; h.y += h.vy * dt; h.ang += h.va * dt;
    if (h.vy > 0 && h.y > P.bcy - P.bry * 0.7 && potInside(h.x, h.y, 0.82)) { h.done = true; potEntry(h); }
    else if (h.y > H + h.D) h.done = true;
  }
  G.halves = G.halves.filter(h => !h.done);
  for (const p of G.parts) {
    p.t += dt; p.vy += g * p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; if (p.vr) p.rot += p.vr * dt;
    if (p.kind === 'drop' || p.kind === 'flake' || p.kind === 'seed' || p.kind === 'pepper') { p.vx *= 1 - 0.6 * dt; }
    if ((p.kind === 'bdrop' || p.kind === 'oil') && p.vy > 0 && p.y >= p.oy) { p.t = p.max; if (Math.random() < 0.3) ripple(p.x, p.y, 8 * L.base / 100, 0.35, { thin: true }); }
  }
  G.parts = G.parts.filter(p => p.t < p.max && p.y < H + 60);
  for (const f of G.floaters) {
    f.t += dt; f.ang += f.va * dt; f.va *= Math.pow(0.12, dt);
    if (f.key === 'bunmoja' && f.bounce) {
      const bt = f.t; if (bt > 0.2 && !f.b1) { f.b1 = true; ripple(f.x, f.y, L.base * 0.3, 0.45); brothDrops(f.x, f.y, 4, { v: 1.2, spread: 0.5 }); }
      if (bt > 0.48 && !f.b2) { f.b2 = true; ripple(f.x, f.y, L.base * 0.85, 0.9); ripple(f.x, f.y, L.base * 0.5, 0.7); brothDrops(f.x, f.y, 14, { v: 2.6, spread: 0.7 }); }
    }
  }
  G.floaters = G.floaters.filter(f => f.t < f.life);
  for (const f of G.frags) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= Math.pow(0.15, dt); f.vy *= Math.pow(0.15, dt); f.ang += f.va * dt; }
  G.frags = G.frags.filter(f => f.t < f.life);
  for (const s of G.strands) s.t += dt; G.strands = G.strands.filter(s => s.t < s.life);
  for (const s of G.stains) s.t += dt; G.stains = G.stains.filter(s => s.t < s.life);
  for (const f of G.flashes) f.t += dt; G.flashes = G.flashes.filter(f => f.t < f.life);
  for (const t of G.texts) { t.t += dt; t.y -= (t.kind === 'ono' ? 30 : 60) * dt; } G.texts = G.texts.filter(t => t.t < t.life);
  if (G.comboMsg) { G.comboMsg.t += dt; if (G.comboMsg.t > 1.15) G.comboMsg = null; }
  if (G.comboTag) { G.comboTag.t += dt; if (G.comboTag.t > 0.9) G.comboTag = null; }
  if (G.banner) { G.banner.t += dt; if (G.banner.t > G.banner.life) G.banner = null; }
  G.shake = Math.max(0, G.shake - dt * 45);
  updateBrothFx(dt);
}

    if (i % 3 === 0) drawChiliPod(x, px, py, 14, rnd() * TAU); else { const q = x.createRadialGradient(px, py, 0, px, py, 5); q.addColorStop(0, 'rgba(255,230,110,.95)'); q.addColorStop(1, 'rgba(255,130,0,0)'); x.fillStyle = q; x.beginPath(); x.arc(px, py, 5, 0, TAU); x.fill(); } }
  x.restore();
  for (let i = 0; i < 6; i++) { const sx = cx + (rnd() - 0.5) * rx, sy = cy - ry * 0.3 - rnd() * ry * 0.6, sz = 30 + rnd() * 40; x.globalAlpha = 0.12; x.drawImage(CACHE.steam, sx - sz / 2, sy - sz / 2, sz, sz); }
  x.globalAlpha = 1;
  if (!total) { x.font = `900 16px ${FONT}`; x.textAlign = 'center'; x.fillStyle = '#ffe7b8'; x.fillText('…국물만 있네?', cx, cy); }
  $('potCap').textContent = total ? `완성된 마라탕 · 재료 ${total}개` : '텅 빈 마라탕';
}

/* =========================================================
   HUD
   ========================================================= */
let hudScore = -1;
function updateHUD(force) {
  if (G.score !== hudScore || force) { const el = $('score'); el.textContent = G.score.toLocaleString(); if (!force) { el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); } hudScore = G.score; }
  $('best').textContent = Math.max(G.best, G.score).toLocaleString();
  const sec = Math.ceil(G.time); $('time').textContent = sec; $('timerBox').classList.toggle('hurry', sec <= 10 && state === 'play');
  $('timerArc').style.strokeDashoffset = String(289 * (1 - G.time / GAME_TIME)); $('timerArc').style.stroke = sec <= 10 ? '#ff4a2a' : '#ffd23f';
}

/* =========================================================
   PAUSE / SETTINGS / BUTTONS
   ========================================================= */
function pauseGame() {
  if (paused || (state !== 'play' && state !== 'countdown')) return;
  paused = true; blade.down = false; $('pauseMenu').classList.remove('hidden'); syncVol(); Snd.suspend();
}
function resumeGame() { paused = false; $('pauseMenu').classList.add('hidden'); Snd.init(); Snd.resume(); Snd.click(); last = performance.now(); }
function syncVol() {
  document.querySelectorAll('.volM').forEach(e => e.value = Snd.S.vm); document.querySelectorAll('.volS').forEach(e => e.value = Snd.S.vs);
  document.querySelectorAll('.muteBtn').forEach(b => b.textContent = Snd.S.muted ? '🔊 소리 켜기' : '🔇 음소거');
  $('soundBtn').textContent = Snd.S.muted ? '🔇' : '🔊';
}
document.querySelectorAll('.volM').forEach(e => e.addEventListener('input', () => { Snd.S.vm = +e.value; LS.set('mlt_vm', Snd.S.vm); Snd.apply(); syncVol(); }));
document.querySelectorAll('.volS').forEach(e => e.addEventListener('input', () => { Snd.S.vs = +e.value; LS.set('mlt_vs', Snd.S.vs); Snd.apply(); syncVol(); }));
document.querySelectorAll('.muteBtn').forEach(b => b.addEventListener('click', () => { Snd.S.muted = !Snd.S.muted; LS.set('mlt_mute', Snd.S.muted); Snd.init(); Snd.apply(); syncVol(); }));
$('soundBtn').addEventListener('click', () => { Snd.init(); $('settings').classList.remove('hidden'); syncVol(); });
$('closeSettings').addEventListener('click', () => { $('settings').classList.add('hidden'); Snd.click(); });
$('startBtn').addEventListener('click', () => { Snd.init(); Snd.click(); startIntro(); });
$('quickBtn').addEventListener('click', () => { Snd.init(); startGame(); });
$('nextBtn').addEventListener('click', e => { e.stopPropagation(); nextLine(); });
$('dialog').addEventListener('click', () => nextLine());
$('skipBtn').addEventListener('click', () => { Snd.click(); startGame(); });
$('goBtn').addEventListener('click', () => startGame());
$('pauseBtn').addEventListener('click', () => { Snd.click(); pauseGame(); });
$('resumeBtn').addEventListener('click', resumeGame);
$('restartBtn').addEventListener('click', () => { Snd.resume(); startGame(); });
$('quitBtn').addEventListener('click', () => { Snd.resume(); paused = false; Snd.stopMusic(); Snd.setRate(1); Snd.endJingle(); showResult(); });
$('homeBtn2').addEventListener('click', () => { Snd.resume(); goTitle(); });
$('retryBtn').addEventListener('click', () => startGame());
$('homeBtn').addEventListener('click', () => { Snd.click(); startIntro(); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' || e.key === 'p' || e.key === 'P') { if (paused) resumeGame(); else pauseGame(); }
  if ((e.key === 'Enter' || e.key === ' ') && state === 'intro' && IN.phase === 'dialog') { e.preventDefault(); if (!$('goBtn').classList.contains('hidden')) startGame(); else nextLine(); }
});
document.addEventListener('visibilitychange', () => { if (document.hidden) pauseGame(); });
function goTitle() {
  state = 'title'; paused = false; hideAll(); Snd.stopMusic(); Snd.setRate(1);
  $('title').classList.remove('hidden'); $('soundBtn').classList.remove('hidden'); G.items = []; G.halves = []; G.parts = []; G.floaters = [];
  $('quickBtn').classList.toggle('hidden', !introSeen);
}

/* =========================================================
   MAIN LOOP
   ========================================================= */
let last = performance.now(), clock = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - last) / 1000); last = now; if (paused) dt = 0; clock += dt;
  try {
    switch (state) {
      case 'title': updateBrothFx(dt); drawTitle(clock); break;
      case 'intro': updateIntro(dt); drawIntro(clock); break;
      case 'countdown': updateCountdown(dt); drawGameScene(clock); drawCountdown(); break;
      case 'play': updatePlay(dt); drawGameScene(clock); break;
      case 'timeup': G.timeupT += dt; updatePlay(dt); drawGameScene(clock); drawTimeUp(); if (G.timeupT > 2.6) showResult(); break;
      case 'result': updatePlay(dt); drawGameScene(clock); updateResult(dt); break;
    }
  } catch (err) { console.error(err); }
}
window.addEventListener('resize', () => { resize(); if (state === 'result') drawFinishedPot(); });
window.__MLT = { G, L, get state() { return state; }, startGame, showResult, IN, spawnItem, sliceItem };

resize();
loadAssets(() => {
  buildSprites(); setupTitleItems(); resetGame();
  $('loading').classList.add('hidden'); goTitle(); syncVol();
  requestAnimationFrame(frame);
});
})();

</script>
</body>
</html>
